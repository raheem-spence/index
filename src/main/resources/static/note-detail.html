<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
        if (localStorage.getItem('sidebar-collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-collapsed');
        }
    </script>
    <title>Index</title>
</head>
<body>
    <aside id="sidebar">
        <div class="logo-div">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
                <!-- The dark rounded tile -->
                <rect width="64" height="64" rx="15" fill="#006363" />
                
                <!-- The white lowercase "i" -->
                <path
                  d="M72 92H281V442H82V534H389V92H568V0H72ZM275 713H387V607H275Z"
                  transform="translate(14.05 52.00) scale(0.056101 -0.056101)"
                  fill="#ffffff"
                />
              </svg>              
            <button class="sidebar-close-btn" id="sidebar-close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-left h-4 w-4" aria-hidden="true" data-tsd-source="/src/components/AppShell.tsx:52:17"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-grid h-4 w-4 shrink-0" aria-hidden="true" data-tsd-source="/src/components/AppShell.tsx:23:7"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/notes.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text h-4 w-4 shrink-0" aria-hidden="true" data-tsd-source="/src/components/AppShell.tsx:23:7"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
                        <span>All Notes</span>
                    </a>
                </li>
                <li class="nav-item">
                    <div class="nav-row">
                        <a href="/courses.html" class="nav-link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers h-4 w-4 shrink-0" aria-hidden="true" data-tsd-source="/src/components/AppShell.tsx:62:15"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>
                            <span>All courses</span>
                        </a>
                        <button type="button" class="chevron-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon" aria-hidden="true" data-tsd-source="/src/components/AppShell.tsx:71:17"><path d="m9 18 6-6-6-6"></path></svg>
                        </button>
                    </div> 
                </li>
                <div id="dropdown-menu" class="dropdown-menu">
                    <ul id="course-list"></ul>
                </div>
            </ul>
        </nav>

        
        <div class="sidebar-user">

            <!-- aria-haspopup="menu" tells screen readers this button opens a popup menu instead of navigating. -->
            <!-- aria-expanded="false" tells screen readers whether the menu is currently open (true) or closed (false). -->
           <button type="button" class="user-menu-btn" id="user-menu-btn" aria-haspopup="menu" aria-expanded="false">
               <span class="user-avatar" id="user-avatar"></span>
                <div class="user-info">
                    <span class="user-name" id="user-name"></span>
                    <span class="user-email truncate" id="user-email"></span>
                </div>
                <!-- chevrons up/down svg icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" 
                 class="lucide lucide-chevrons-up-down preview-icon"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>
                </svg>
           </button>

           <!-- the 'role' attribute tells screen readers and assistive tech what an element does when standard HTML tags don't convey it. -->
           <div class="user-popover hidden" id="user-popover" role="menu">
            <button type="button" class="popover-item" id="theme-toggle-btn" role="menuitem">
                <!-- sun/moon icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
                <span>Toggle theme</span>
            </button>
            <a href="/settings.html" class="popover-item" role="menuitem">
                <!-- settings gear icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span>Settings</span>
            </a>

            <!-- feeeback button -->
            <button type="button" class="popover-item" id="open-feedback-btn" role="menuitem">
                <svg class="popover-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  <span>Send feedback</span>
            </button>
            <div class="popover-divider"></div>
            <button type="button" class="popover-item popover-logout"  id="logout-btn" role="menuitem">
                <!-- Log out door icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" x2="9" y1="12" y2="12"/>
                </svg>
                <span>Log out</span>
            </button>
           </div>
        </div>
    </aside>
    <button type="button" id="sidebar-reopen-btn" class="sidebar-reopen-btn">
        <span class="reopen-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
                <!-- The dark rounded tile -->
                <rect width="64" height="64" rx="15" fill="#006363" />
                
                <!-- The white lowercase "i" -->
                <path
                  d="M72 92H281V442H82V534H389V92H568V0H72ZM275 713H387V607H275Z"
                  transform="translate(14.05 52.00) scale(0.056101 -0.056101)"
                  fill="#ffffff"
                />
              </svg>   
        </span>

        <span class="reopen-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-left">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M9 3v18"></path>
            </svg>
    
        </span>
    </button>
    <main>
        <div id="note-detail-container">

            <nav class="note-detail-header">
                <a href="" class="back-link" id="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left h-3.5 w-3.5" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path>
                    </svg>
                    <span id="back-destination"></span>
                </a>

                <!-- owner actions -- starts hidden by default -->
                <div id="owner-actions" class="owner-actions hidden">
                    <div id="view-actions">
                        <button type="button" id="edit-note-btn" class="action-btns">
                            <!-- edit icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
                            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil" 
                            aria-hidden="true"">
                            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z">
                            </path><path d="m15 5 4 4"></path></svg>
                            Edit
                        </button>
                        
                        <div id="delete-actions-container">
                            <button type="button" id="delete-note-btn" class="action-btns">
                                <!-- delete icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
                                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" 
                                class="lucide lucide-trash2 lucide-trash-2" aria-hidden="true">
                                <path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path>
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                <span id="delete-text">Delete</span>
                            </button>
                            <div id="delete-confirm-group" class="hidden">
                                <span class="delete-confirmation-text">Delete?</span>
                                <button type="button" id="yes-delete-btn" class="yes-delete-btn">Yes</button>
                                <button type="button" id="no-delete-btn" class="no-delete-btn">No</button>
                            </div>
                        </div>
                    </div>
                    <div id="edit-actions" class="hidden">
                        <button type="button" id="save-changes-btn" class="save-changes-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 6 9 17l-5-5"></path>
                            </svg>
                            Save changes
                        </button>
                        <button type="button" id="cancel-changes-btn" class="cancel-changes-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
                            </svg>
                         Cancel
                        </button>
                    </div>
                </div>
            </nav>

            <article class="note-document" id="note-document">
                <!-- header: title, course badge, author, timestamp -->
                <header class="note-header">
                    <input type="text" required id="edit-input" autocomplete="off" class="edit-input hidden">
                    <h1 class="note-detail-title" id="note-title"></h1>
                    <dl class="note-meta-grid">
                        <div class="list-group note-detail-course">
                            <!-- book icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open h-4 w-4 text-muted-foreground" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>
                            <dt class="list-description">Course</dt>
                            <dd class="list-item" id="note-course">
                                <a id="note-course-link" class="course-link">
                                    <span id="note-course-name"></span>
                                </a>
                            </dd>
                        </div>
                        <div class="list-group">
                            <!-- clock icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock h-4 w-4 text-muted-foreground" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
                            <dt class="list-description" id="note-modification"></dt>
                            <dd class="list-item" id="note-date">
                            </dd>
                        </div>
                        <div class="list-group">
                            <!-- person icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user h-4 w-4 text-muted-foreground" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <dt class="list-description">Author</dt>
                            <dd class="list-item" id="note-author"></dd>
                        </div>
                    </dl>
                </header>

                <!-- body -->
                <textarea required id="edit-textarea" class="edit-textarea hidden"></textarea>
                <div class="note-body" id="note-body"></div>

                <!-- attachments section (if they exist) -->
                <section class="note-attachments hidden" id="note-attachments" aria-labelledby="attachments-heading">
                    <h2 id="attachments-heading" class="attachments-title">
                        <!-- paperclip icon -->
                        <svg class="attachments-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        <span>Attachments</span>
                        <span class="attachments-count" id="attachments-count"></span>
                    </h2>
                    <div class="attachments-grid" id="attachments-grid"></div>
                </section>
                <section class="attachments-section hidden" id="dropzone-section">
                    <div class="attachments-header">
                        <h2 class="attachments-title">
                                <svg class="attachments-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                </svg>
                                 Files <span class="attachments-meta"> optional · Up to 5 PDFs or images, max 25 MB each</span>
                            </h2>
                    </div>
                    <label for="note-file-input" id="dropzone" class="dropzone">
                        <span aria-hidden="true" class="dropzone-icons">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="left" aria-hidden="true">
                            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5">
                            </path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path>
                            </svg>
                
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="middle" aria-hidden="true"><path d="M12 3v12">
                            </path><path d="m17 8-5-5-5 5"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            </svg>
                
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="right" aria-hidden="true">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                            </svg>
                        </span>
                        <span class="dropzone-text">
                            <strong>Drop files here</strong> or choose files
                        </span>
                    </label>
                </section>
                <footer class="note-footer" id="note-footer">
                    <button type="button" id="helpful-btn" class="helpful-btn">
                        <!-- thumbs up icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
                            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" 
                            aria-hidden="true">
                            <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z">
                            </path><path d="M7 10v12"></path>
                        </svg>
                        Helpful <span id="helpful-count" class="helpful-count"></span>
                    </button>
                    <button type="button" id="copy-link-btn" class="copy-btn">
                        <!-- link icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
                            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" 
                            class="lucide lucide-link" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71">
                            </path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        Copy link
                    </button>
                </footer>
            </article>
        </div>
    </main>
</body>
<script type="module" src="/js/pages/note-detail.js" defer></script>
<script type="module" src="/js/script.js" defer></script>
</html>
