spring.application.name=notes-api-v2
spring.datasource.url=jdbc:postgresql://localhost:5333/noteshare
spring.datasource.username=raheemspence
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Turn off web caching so the browser fetches your immediate edits
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

server.error.include-message=always
server.error.include-binding-errors=always

aws.s3.region=us-east-2
aws.s3.bucket-name=index-app-storage-rs

# AWS Region configuration for Spring Cloud AWS
spring.cloud.aws.region.static=us-east-2

# AWS Credentials (if not using an AWS credentials file or environment variables)
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
