spring.application.name=notes-api-v2
spring.datasource.url=jdbc:postgresql://localhost:5333/noteshare
spring.datasource.username=raheemspence
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Turn off web caching so the browser fetches your immediate edits
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

server.error.include-message=always
server.error.include-binding-errors=always

